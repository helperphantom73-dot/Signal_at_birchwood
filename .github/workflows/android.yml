
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup templates
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/export_templates.tpz
          unzip -q /tmp/export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android export
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          cp /root/.config/godot/editor_settings-4.3.tres \
            "$HOME/.config/godot/editor_settings-4.3.tres"
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          test -d /usr/lib/android-sdk
          test -f /root/debug.keystore

      - name: Import
        run: godot --headless --import

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose \
            --export-debug "Android" build/SignalAtBirchwood.apk
          test -s build/SignalAtBirchwood.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalAtBirchwood-apk
          path: build/SignalAtBirchwood.apk
